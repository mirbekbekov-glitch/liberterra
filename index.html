<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liberterra — недвижимость Кыргызстана</title>
<meta name="description" content="Каталог проверенных объектов для аренды и покупки в Бишкеке и рабочее место для агентов по недвижимости.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1a1a; --ink2:#4A4A4A; --mute:#8A8A8A; --line:#E2E5EA; --bg:#F5F6F8; --card:#fff;
  --brand:#1B3A5C; --brand-d:#14304D; --brand-dd:#0D2440; --brand-t:#E8EDF2;
  --accent:#1B3A5C; --accent-d:#14304D; --green:#1B6B4A; --green-t:#E6F4ED;
  --ok:#1B6B4A; --ok-t:#E6F4ED; --warn:#E8A40E; --warn-t:#FFF8E6; --info:#1B3A5C; --info-t:#E8EDF2;
  --danger:#D93025; --danger-t:#FFE9EA;
  --surface:#fff; --surface-raised:#fff; --surface-sunken:#EBEDF0;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06); --shadow-md:0 4px 12px rgba(0,0,0,.08); --shadow-lg:0 8px 28px rgba(0,0,0,.12);
  --f-display:'Onest',system-ui,sans-serif; --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --sp-xs:4px; --sp-sm:8px; --sp-md:16px; --sp-lg:24px; --sp-xl:32px; --sp-2xl:48px; --sp-3xl:64px;
  --r-card:24px; --r-ctl:14px; --r-pill:999px; --w:1200px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.025em;line-height:1.12}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.wrap{max-width:var(--w);margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--mute)} .ink2{color:var(--ink2)}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrapf{flex-wrap:wrap}
.grow{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:var(--r-ctl);border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;transition:all .15s ease}
.btn:hover{border-color:#999;background:#f5f5f5}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:var(--shadow-sm)}
.btn.primary:hover{background:var(--brand-d);border-color:var(--brand-d);transform:translateY(-1px)}
.btn.dark{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.dark:hover{background:var(--brand-d);transform:translateY(-1px)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:var(--r-ctl);border:1.5px solid var(--line);background:#fff}
.icon-btn:hover{border-color:var(--ink)}
.icon-btn.on{color:var(--accent-d);border-color:var(--accent-d);background:var(--warn-t)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.03em}
.logo-mark{width:36px;height:40px;background:var(--brand);display:grid;place-items:center;clip-path:polygon(50% 0%, 100% 28%, 100% 85%, 100% 100%, 0% 100%, 0% 85%, 0% 28%);border-radius:0 0 8px 8px}
.logo-mark svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{padding:9px 14px;border-radius:10px;text-decoration:none;font-weight:600;font-size:15px;color:var(--ink2)}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a[aria-current=page]{background:var(--bg);color:var(--ink)}
.seg{display:inline-flex;background:rgba(255,255,255,.5);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;color:var(--ink2);min-height:34px;transition:all .15s ease}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.top .tools{display:flex;align-items:center;gap:10px;margin-left:auto}

/* bottom nav (mobile) */
.tabbar{display:none}

/* hero */
.hero{background:#fff;border-bottom:1px solid var(--line);overflow:hidden}
.partners-section{padding:48px 0;text-align:center;border-top:none}
.partners-label{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-bottom:20px}
.partners{display:flex;align-items:center;justify-content:center;gap:40px;flex-wrap:wrap}
.partners span{font-size:18px;font-weight:700;color:var(--ink2);letter-spacing:-.02em;opacity:.55;transition:opacity .2s}
.partners span:hover{opacity:1}
.hero .wrap{display:block;padding-top:56px;padding-bottom:56px;text-align:center}
.hero h1{font-size:clamp(32px,4.4vw,50px);max-width:26ch;margin:0 auto;font-weight:800;letter-spacing:-.03em}
.hero .lead{font-size:17px;color:var(--ink2);margin:16px auto 0;max-width:52ch;line-height:1.6}
.search{margin:30px auto 0;max-width:720px;background:#fff;border:1.5px solid var(--line);border-radius:var(--r-card);padding:14px;box-shadow:var(--shadow-sm);text-align:left}
.search .tabs{display:flex;gap:6px;padding:4px 4px 10px}
.pill-tab{border:0;background:var(--bg);border-radius:var(--r-pill);padding:8px 18px;font-weight:600;min-height:38px}
.pill-tab[aria-pressed=true]{background:var(--brand);color:#fff}
.search .fields{display:grid;grid-template-columns:1.1fr 1fr .9fr auto;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--ink2)}
.inp,.sel{width:100%;min-height:46px;border:1.5px solid var(--line);background:#fff;border-radius:var(--r-ctl);padding:0 14px;transition:border-color .2s,box-shadow .2s}
textarea.inp{padding:12px 14px;min-height:96px;resize:vertical}
.inp:hover,.sel:hover{border-color:#B0B5C0}
.inp:focus,.sel:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(27,58,92,.12)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:var(--r-pill);padding:6px 14px;font-weight:500;font-size:14px;min-height:36px;text-decoration:none}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}

/* verification seal composition */
.seal-stage{position:relative;max-width:440px;margin-left:auto;width:100%}
.v-card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-lg)}
.v-card .art{aspect-ratio:16/10}
.v-card .body{padding:16px 18px 18px}
.checks{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.checks li{display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px}
.tick{width:22px;height:22px;border-radius:50%;background:var(--ok);display:grid;place-items:center;flex:none}
.tick svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.seal{position:absolute;top:-26px;right:-18px;width:104px;height:104px;transform:rotate(12deg)}
.seal svg{width:100%;height:100%}
.checks li{opacity:1}
@media (prefers-reduced-motion:no-preference){
  .checks li{animation:tickin .5s both}
  .checks li:nth-child(1){animation-delay:.3s}.checks li:nth-child(2){animation-delay:.7s}.checks li:nth-child(3){animation-delay:1.1s}
  .seal{animation:stamp .55s 1.5s cubic-bezier(.2,1.6,.4,1) both}
}
@keyframes tickin{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(1.9)}to{opacity:1;transform:rotate(12deg) scale(1)}}

/* sections */
.sec{padding:64px 0}
.sec.tight{padding:40px 0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(22px,2.8vw,32px);font-weight:700}
.sec-head p{color:var(--ink2);margin-top:8px;max-width:56ch;line-height:1.6}

/* cards */
.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border-radius:var(--r-card);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.lcard{display:flex;flex-direction:column;overflow:hidden;position:relative;transition:border-color .2s,transform .2s,box-shadow .2s}
.lcard:hover{border-color:#C8CBD2;box-shadow:var(--shadow-md);transform:translateY(-2px)}
.lcard .art{aspect-ratio:16/11;display:block;width:100%}
.lcard .art-link{display:block;position:relative}
.lcard .fav{position:absolute;top:12px;right:12px;background:#fff;border-color:transparent;width:40px;height:40px}
.lcard .badges{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}
.lcard .content{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.price{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.02em}
.price small{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--mute);letter-spacing:0}
.title{font-weight:600;font-size:16px;text-decoration:none}
.title:hover{text-decoration:underline}
.specs{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink2);font-size:14px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--bg);line-height:1.3;letter-spacing:.01em}
.badge.ok{background:var(--ok-t);color:var(--ok)}
.badge.new{background:var(--brand);color:#fff}
.badge.warn{background:var(--warn-t);color:var(--warn)}
.badge.comm{background:var(--brand);color:#fff}
.badge.red{background:var(--brand-t);color:var(--brand-dd)}
.badge.info{background:var(--info-t);color:var(--info)}
.badge svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.lcard .foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.ava{width:34px;height:34px;border-radius:50%;background:var(--brand-t);color:var(--brand-dd);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;border:2px solid rgba(27,107,74,.1)}
.ava.lg{width:64px;height:64px;font-size:24px}
.lcard.list{flex-direction:row}
.lcard.list .art-link{width:300px;flex:none}
.lcard.list .art{height:100%;aspect-ratio:auto;min-height:210px}

/* catalog layout */
.cat{display:grid;grid-template-columns:290px 1fr;gap:24px;padding:28px 0 60px;align-items:start}
.filters{position:sticky;top:88px;padding:20px;display:grid;gap:18px}
.filters h3{font-size:17px}
.fgroup{display:grid;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.switch{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--brand-d)}
.res-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.res-head h1{font-size:24px}
.stack{display:grid;gap:16px}
.empty{padding:48px 24px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h3{font-size:20px}
.mapbox{position:relative;border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line);background:#E8EEF2}
.mapbox svg.map{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:var(--brand);color:#fff;font-weight:700;font-size:13px;padding:6px 10px;border-radius:10px 10px 10px 2px;white-space:nowrap}
.pin:hover,.pin[aria-pressed=true]{background:var(--brand-d);z-index:3}
.mapcard{position:absolute;left:16px;bottom:16px;right:16px;max-width:380px;background:#fff;border-radius:16px;padding:14px;border:1.5px solid var(--ink)}
.dl{position:absolute;transform:translateX(-50%);font-size:12px;font-weight:600;color:#7C8796;pointer-events:none;white-space:nowrap}
.mapnote{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.92);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--ink2)}

/* object page */
.crumbs{padding:20px 0 0;font-size:14px;color:var(--mute)}
.crumbs a{color:var(--ink2)}
.obj{display:grid;grid-template-columns:1fr 380px;gap:28px;padding:16px 0 70px;align-items:start}
.gallery{border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line);position:relative}
.gallery .art{display:block;width:100%;aspect-ratio:16/9}
.gallery .count{position:absolute;left:16px;bottom:16px;background:rgba(18,20,26,.85);color:#fff;border-radius:10px;padding:5px 12px;font-size:13px;font-weight:600}
.panel{padding:24px}
.panel h2{font-size:20px;margin-bottom:16px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv dt{color:var(--mute)} .kv dd{margin:0;font-weight:600;text-align:right}
.side{position:sticky;top:88px;display:grid;gap:16px}
.side .big{font-family:var(--f-display);font-size:30px;font-weight:600;letter-spacing:-.03em}
.contact-btns{display:grid;gap:8px}
.verif{display:grid;gap:8px;margin-top:6px}
.verif div{display:flex;gap:10px;align-items:center;font-size:15px}
.agentbox{display:flex;gap:12px;align-items:center}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;min-height:38px}
.slot[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.days{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
.day{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;text-align:center;min-width:64px;font-weight:600}
.day small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.day[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.day[aria-pressed=true] small{color:#C9CDD6}
.agent-only{border:1.5px dashed var(--ink);background:#fff;border-radius:var(--r-card);padding:20px}
.agent-only .hd{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:10px}
.note{font-size:13px;color:var(--mute)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form{display:grid;gap:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink2)}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--brand-d);flex:none}

/* requests */
.req{padding:20px;display:grid;gap:12px}
.req .meta{display:flex;gap:8px;flex-wrap:wrap}

/* agent band */
.band{background:var(--brand);color:#fff;border-radius:var(--r-card);padding:48px 44px;display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center}
.band>div{border-radius:0;padding:0}
.band>div:first-child{background:transparent}
.band>div:last-child{background:transparent}
.band h2{font-size:clamp(24px,3vw,32px)}
.band h3{font-size:clamp(20px,2.5vw,28px)}
.band p{color:rgba(255,255,255,.7);margin-top:14px;max-width:50ch}
.split{display:grid;gap:10px}
.split .bar{display:flex;height:46px;border-radius:12px;overflow:hidden;font-weight:700;font-size:14px}
.split .bar span{display:grid;place-items:center;flex:1}
.split .a{background:var(--brand)} .split .b{background:#fff;color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:s}
.step{padding:22px;border-radius:var(--r-card);background:#fff;border:1px solid var(--line);position:relative}
.step .n{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:14px}
.step.done .n{background:var(--ok)}
.step.now .n{background:var(--brand-d)}
.step h3{font-size:16px;margin-bottom:6px}
.step p{font-size:14px;color:var(--ink2)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

/* cabinet */
.cab{display:grid;grid-template-columns:260px 1fr;gap:24px;padding:28px 0 70px;align-items:start}
.side-nav{padding:16px;display:grid;gap:4px;position:sticky;top:88px}
.side-nav .who{padding:8px 8px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:8px}
.side-nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;font-weight:600;color:var(--ink2)}
.side-nav a:hover{background:var(--bg);color:var(--ink)}
.side-nav a[aria-current=page]{background:var(--brand-t);color:var(--brand-dd)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{padding:18px;border-radius:16px;background:var(--bg)}
.tile b{display:block;font-family:var(--f-display);font-size:26px;font-weight:600;margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-weight:600;color:var(--mute);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr[data-a]:hover td{background:var(--brand-t);cursor:pointer}
.tbl tr[data-a]{transition:background .1s}
.scroll-x{overflow:auto}
/* kanban */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;min-height:340px}
.kanban-col{min-width:240px;max-width:260px;flex:0 0 240px;background:var(--bg);border-radius:var(--r-card);padding:14px}
.kanban-col h4{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:2px solid var(--line)}
.kanban-col:nth-child(1) h4{border-color:var(--info);color:var(--info)}
.kanban-col:nth-child(2) h4{border-color:var(--brand);color:var(--brand)}
.kanban-col:nth-child(3) h4{border-color:#8B5CF6;color:#8B5CF6}
.kanban-col:nth-child(4) h4{border-color:var(--warn);color:#B45309}
.kanban-col:nth-child(5) h4{border-color:#EC4899;color:#EC4899}
.kanban-col:nth-child(6) h4{border-color:var(--ok);color:var(--ok)}
.kanban-col h4 .cnt{background:var(--line);color:var(--ink2);font-size:11px;padding:2px 8px;border-radius:var(--r-pill);font-weight:600}
.k-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--line);cursor:pointer;box-shadow:var(--shadow-sm);transition:box-shadow .15s,transform .15s}
.k-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.k-card:active{transform:translateY(0)}
.k-card .k-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.k-card .k-title{font-weight:600;font-size:14px;line-height:1.3;flex:1}
.k-card .k-type{font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--r-pill);white-space:nowrap}

  const seen=new Set();return [...latest.values()].filter(r=>text(r.status).toLowerCase()==='опубликован').map(r=>{
    const f=fmt.websiteFields(r),price=fmt.price(r.price).replace(/\${2,}/g,'$');
    const type=text(r.segment).toLowerCase()==='коммерция'?'commercial':/участ|земл/i.test(r.title)?'land':/дом|коттедж|таунхаус/i.test(r.title)?'house':/кварт|студ/i.test(r.title)?'apartment':'';
    const photos=text(r.photo_url).split(/\s*(?:\||\n)\s*/).map(u=>u.replace(/^https:\/\/liberterra-kg-catalog\.pages\.dev\/uploads\//i,'https://hidden-pine-cbff.mirbekbekov.workers.dev/uploads/')).filter(u=>/^https?:\/\//i.test(u));
    const currency=/\$|USD/i.test(price)?'USD':/сом|KGS/i.test(price)?'KGS':null;
    return {id:r.id,deal:text(r.deal).toLowerCase(),segment:text(r.segment),city:text(r.city)||'Бишкек',district:text(r.district)||'Район уточняется',title:f.title||'Объект недвижимости',price,amount:num(price),currency,per:f.per,area:f.area,floor:f.floor,rooms:text(r.rooms),type,photos,verified:['true','1','yes','да','истина'].includes(text(r.verified).toLowerCase()),publisher:text(r.listing_agent_name),date:text(r.updated_at||r.published_at||r.created_at),description:text(r.description)};
  }).filter(r=>{const key=[r.segment,r.city,r.deal,r.rooms,r.price,r.per,r.title,r.area,r.floor,r.district].map(v=>text(v).toLowerCase()).join('|');if(seen.has(key))return false;seen.add(key);return true});
}
function amountIn(item,currency){if(item.amount===null||!item.currency)return null;if(item.currency===currency)return item.amount;return state.rate?item.amount*(currency==='KGS'?state.rate:1/state.rate):null}
function priceHTML(item){const amount=amountIn(item,state.currency);const price=amount===null?item.price:new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(amount)+(state.currency==='USD'?' $':' сом');return esc(price||'Цена по запросу')+(item.deal==='аренда'&&item.per?' <small>'+esc(item.per)+'</small>':'')}
function card(item){const href='/object.html?id='+encodeURIComponent(item.id);return `<article class="card lcard"><a class="art-link" href="${href}" tabindex="-1" aria-hidden="true">${item.photos.length?`<img class="property-photo" src="${esc(item.photos[0])}" alt="" loading="lazy" decoding="async">`:'<div class="photo-empty">Фото уточняется</div>'}${item.verified?'<span class="badges"><span class="badge ok">Проверен</span></span>':''}</a><div class="content"><div class="price">${priceHTML(item)}</div><a class="title" href="${href}">${esc(item.title)}</a><div class="specs">${[item.area,item.floor].filter(Boolean).map(v=>'<span>'+esc(v)+'</span>').join('')}</div><div class="muted">${esc(item.city)} · ${esc(item.district)}</div><div class="foot"><span class="badge info">${item.deal==='аренда'?'Аренда':'Продажа'}</span><a class="btn sm" href="${href}">Подробнее</a></div></div></article>`}
function selectedItems(){let items=state.items.filter(r=>r.deal===state.deal);for(const key of ['city','district','type'])if(state[key])items=items.filter(r=>r[key]===state[key]);if(state.rooms)items=items.filter(r=>state.rooms==='4'?num(r.rooms)>=4:num(r.rooms)===Number(state.rooms));if(state.verified)items=items.filter(r=>r.verified);if(state.query){const q=state.query.toLocaleLowerCase();items=items.filter(r=>[r.title,r.city,r.district,r.description,r.id].join(' ').toLocaleLowerCase().includes(q))}if(state.min||state.max)items=items.filter(r=>{const a=amountIn(r,state.currency);return a!==null&&(!state.min||a>=Number(state.min))&&(!state.max||a<=Number(state.max))});items.sort((a,b)=>state.sort==='low'?(amountIn(a,state.currency)??Infinity)-(amountIn(b,state.currency)??Infinity):state.sort==='high'?(amountIn(b,state.currency)??-Infinity)-(amountIn(a,state.currency)??-Infinity):(Date.parse(b.date)||0)-(Date.parse(a.date)||0));return items}
function options(values,value,label){return '<option value="">'+label+'</option>'+values.map(v=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(v)}</option>`).join('')}
function dealTabs(){return `<div class="seg" role="group" aria-label="Тип сделки"><button type="button" data-deal="аренда" aria-pressed="${state.deal==='аренда'}">Аренда</button><button type="button" data-deal="продажа" aria-pressed="${state.deal==='продажа'}">Покупка</button></div>`}
function filters(){return `<form id="searchForm" class="search"><div class="tabs">${dealTabs()}</div><div class="fields"><div class="field"><label for="city">Город</label><select id="city" name="city" class="sel">${options([...new Set(state.items.map(r=>r.city))].sort(),state.city,'Все города')}</select></div><div class="field"><label for="district">Район</label><select id="district" name="district" class="sel">${options([...new Set(state.items.filter(r=>!state.city||r.city===state.city).map(r=>r.district))].sort(),state.district,'Любой район')}</select></div><div class="field"><label for="query">Поиск</label><input id="query" name="query" class="inp" value="${esc(state.query)}" placeholder="Название, район или ID"></div><button class="btn primary">Найти</button></div><details class="extra-filters"><summary>Дополнительные фильтры</summary><div class="fields"><div class="field"><label for="type">Тип объекта</label><select id="type" name="type" class="sel"><option value="">Любой</option>${Object.entries(TYPES).map(([v,t])=>`<option value="${v}" ${state.type===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="rooms">Комнат</label><select id="rooms" name="rooms" class="sel"><option value="">Любое</option>${['1','2','3','4'].map(v=>`<option value="${v}" ${state.rooms===v?'selected':''}>${v==='4'?'4+':v}</option>`).join('')}</select></div><div class="field"><label for="min">Цена от, ${state.currency==='KGS'?'сом':'$'}</label><input id="min" name="min" class="inp" type="number" min="0" value="${esc(state.min)}"></div><div class="field"><label for="max">Цена до, ${state.currency==='KGS'?'сом':'$'}</label><input id="max" name="max" class="inp" type="number" min="0" value="${esc(state.max)}"></div></div><label class="switch"><input name="verified" type="checkbox" ${state.verified?'checked':''}> Только проверенные</label><button type="button" class="btn sm" data-reset>Сбросить фильтры</button></details></form>`}
function resultHTML(home){if(state.status==='loading')return '<div class="card empty" role="status">Загружаем ваши объекты…</div>';if(state.status==='error')return '<div class="card empty" role="alert"><h3>Не удалось загрузить каталог</h3><p>Проверьте соединение и повторите попытку.</p><button class="btn primary" data-retry>Повторить</button></div>';const items=selectedItems();return `<div class="res-head"><div><h2>${home?'Объекты из каталога':state.deal==='аренда'?'Аренда недвижимости':'Покупка недвижимости'}</h2><p class="muted" id="resultCount">Найдено объектов: ${items.length}</p></div><div class="row wrapf"><select class="sel" id="sort" aria-label="Сортировка"><option value="new" ${state.sort==='new'?'selected':''}>Сначала новые</option><option value="low" ${state.sort==='low'?'selected':''}>Сначала дешевле</option><option value="high" ${state.sort==='high'?'selected':''}>Сначала дороже</option></select>${home?'<a class="btn" href="#/catalog">Весь каталог</a>':''}</div></div>${items.length?`<div class="grid g3">${(home?items.slice(0,6):items).map(card).join('')}</div>`:'<div class="card empty"><h3>Объекты не найдены</h3><p>Измените фильтры или оставьте заявку.</p><button class="btn" data-reset>Сбросить фильтры</button><a class="btn primary" href="/add-request.html">Оставить заявку</a></div>'}`}
function render(){
  const route=location.hash.slice(1).split('?')[0]||'/';const redirects={'/cabinet':'/agent-cabinet.html','/add':'/add-object.html','/requests':'/requests.html','/agents':'/agents.html'};
  if(redirects[route]){location.replace(redirects[route]);return}if(route.startsWith('/object/')){location.replace('/object.html?id='+encodeURIComponent(route.slice(8)));return}
  const home=route!=='/catalog';document.title=home?'Liberterra — недвижимость Кыргызстана':'Каталог недвижимости — Liberterra';
  document.querySelector('#main').innerHTML=(home?`<section class="hero"><div class="wrap"><div><h1>Найдите своё пространство для комфортной работы и жилья</h1><p class="lead">Недвижимость в Кыргызстане. Ваши объекты, реальные фотографии и актуальные предложения из каталога Liberterra.</p>${filters()}<div class="quick" style="justify-content:center"><a class="chip" href="/add-request.html">Не нашли? Оставьте заявку</a><a class="chip" href="/add-object.html">Разместить объект</a></div></div></div></section>`:`<section class="sec tight"><div class="wrap"><h1>Каталог недвижимости</h1>${filters()}</div></section>`)+`<section class="sec"><div class="wrap" id="results" aria-live="polite">${resultHTML(home)}</div></section>`+(home?`<section class="sec tight"><div class="wrap"><div class="band"><div><h2>Рабочий кабинет агента</h2><p>Ваши объекты, клиенты и заявки — в действующем кабинете Liberterra.</p><div class="row wrapf"><a class="btn primary" href="/agent-cabinet.html">Открыть кабинет</a><a class="btn" href="/agents.html">Наши агенты</a></div></div><div><h3>Ищете недвижимость?</h3><p>Опишите, что вам нужно, и отправьте заявку агентам.</p><a class="btn primary" href="/add-request.html">Оставить заявку</a></div></div></div></section>`:'');
  document.querySelectorAll('[data-currency]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.currency===state.currency));
  document.querySelectorAll('img.property-photo').forEach(img=>img.addEventListener('error',()=>{const fallback=document.createElement('div');fallback.className='photo-empty';fallback.textContent='Фото временно недоступно';img.replaceWith(fallback)},{once:true}));
}
let inFlight=false;
async function loadCatalog(){if(inFlight)return;inFlight=true;state.status='loading';render();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{const response=await fetch('/api/public-catalog?catalog_fresh='+Date.now(),{cache:'no-store',signal:controller.signal});if(!response.ok)throw new Error('HTTP '+response.status);state.items=mapRows(parseCSV(await response.text()));state.status='ready'}catch(error){state.items=[];state.status='error';console.error('Catalog unavailable:',error.message)}finally{clearTimeout(timer);inFlight=false;render()}}
document.addEventListener('submit',event=>{if(event.target.id!=='searchForm')return;event.preventDefault();const data=new FormData(event.target);for(const k of ['city','district','query','type','rooms','min','max'])state[k]=text(data.get(k));state.verified=data.has('verified');if(location.hash!=='#/catalog')location.hash='/catalog';else render()});
document.addEventListener('click',event=>{const target=event.target.closest('button');if(!target)return;if(target.dataset.deal){state.deal=target.dataset.deal;render()}if(target.dataset.currency){state.currency=target.dataset.currency;render()}if(target.hasAttribute('data-retry'))loadCatalog();if(target.hasAttribute('data-reset')){Object.assign(state,{city:'',district:'',type:'',query:'',rooms:'',min:'',max:'',verified:false});render()}});
document.addEventListener('change',event=>{if(event.target.id==='sort'){state.sort=event.target.value;render()}if(event.target.id==='city'){state.city=event.target.value;state.district='';render()}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
const params=new URLSearchParams(location.search);if(params.get('deal')==='продажа')state.deal='продажа';
render();loadCatalog();
fetch('/api/exchange-rate').then(r=>r.ok?r.json():null).then(r=>{if(r?.ok&&Number.isFinite(r.rate)&&r.rate>0){state.rate=r.rate;render()}}).catch(()=>{});
</script></body></html>
