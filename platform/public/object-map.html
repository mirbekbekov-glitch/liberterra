<!doctype html>
<html lang="ru">
<head>
  <script src="/telegram-membership.js?v=20260915-1"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта объектов — Liberterra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/style.css?v=20260908-agents-mobile-entry-1">
  <script src="/catalog-translations.js?v=20260820-1" defer></script>
  <script src="/i18n.js?v=20260929-theme-2" defer></script>
<link rel="stylesheet" href="/site-theme.css?v=20260930-nav-3">
<script src="/site-theme.js?v=20260930-nav-3" defer></script>
<link rel="stylesheet" href="/public-v20.css"><script src="/reference-translations.js" defer></script><script src="/public-copy.js" defer></script><script src="/reference-translator.js" defer></script><script src="/public-v20.js" defer></script>  <link rel="stylesheet" href="/v20-global.css?v=20261022-1">
</head>
<body class="v20 object-map-page">
  <header class="site-header internal-header">
    <div class="wrap header-inner">
      <a class="brand" href="/"><img class="brand-logo" src="assets/liberterra-logo-adapted.png?v=20260813-1" alt="Liberterra"></a>
      <a class="submission-back" href="/" data-smart-back>← Назад</a>
    </div>
  </header>
  <main class="object-map-layout">
    <div class="object-map-mobile-tools">
      <button id="mapFilterToggle" type="button" aria-expanded="false" aria-controls="mapFilterPanel">Фильтры</button>
      <span id="mapMobileCount">Загружаем…</span>
    </div>
    <aside class="object-map-panel" id="mapFilterPanel">
      <div class="object-map-title"><div><span>Карта Бишкека</span><h1>Объекты на карте</h1></div><a href="/">Список</a></div>
      <button class="object-map-filter-close" id="mapFilterClose" type="button" aria-label="Закрыть фильтры">×</button>
      <div class="object-map-filters">
        <input id="mapSearch" type="search" placeholder="Район, адрес, описание">
        <div class="object-map-chips" aria-label="Тип сделки">
          <button class="is-active" type="button" data-map-deal="all">Все</button>
          <button type="button" data-map-deal="аренда">Аренда</button>
          <button type="button" data-map-deal="продажа">Продажа</button>
        </div>
        <div class="object-map-filter-grid">
          <label>Тип объекта<select id="mapType"><option value="all">Все типы</option><option value="apartment">Квартира</option><option value="house">Дом</option><option value="land">Участок</option><option value="commercial">Коммерция</option></select></label>
          <label>Комнаты<select id="mapRooms"><option value="all">Любые</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4+">4+</option></select></label>
          <label>Район<select id="mapDistrict"><option value="all">Любой район</option></select></label>
          <label>Цена до<span class="object-map-price"><input id="mapPriceMax" type="number" min="0" step="1000" placeholder="Не важно"><select id="mapCurrency"><option value="kgs">сом</option><option value="usd">$</option></select></span></label>
        </div>
        <label class="object-map-favorite-toggle"><input id="mapFavorites" type="checkbox"><span>♥ Только избранные</span></label>
      </div>
      <p class="object-map-count" id="mapCount">Загружаем объекты…</p>
      <div class="object-map-results" id="mapResults"></div>
    </aside>
    <section class="object-map-canvas" id="objectsMap" aria-label="Карта объектов недвижимости"></section>
    <article class="object-map-selected" id="mapSelectedObject" hidden aria-live="polite"></article>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/catalog-data.js?v=20260814-2"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <script src="/agent-access.js?v=20260928-public-cache-1"></script>
  <script src="/back-navigation.js?v=20260814-1"></script>
  
  <script src="/object-map.js?v=20261006-filter-sync-1"></script>

  <script src="/v20-global.js?v=20261022-1" defer></script>
</body>
</html>
