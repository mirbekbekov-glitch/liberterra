html { zoom: 1; }
:root, body {
  --bg: #f7f7f5; --card: #fff; --ink: #252525; --muted: #707070;
  --red: #e52732; --red-hover: #c91f29; --red-soft: #f7e9ec;
  --red-line: #e7c6ce; --line: #e8e8e5; --line-strong: #dcd8d5;
  --radius: 14px; --shadow: 0 4px 20px rgb(0 0 0 / 6%);
}
body { background: var(--bg); color: var(--ink); font-family: "Onest", system-ui, sans-serif; line-height: 1.5; }
body :is(button, input, select, textarea) { font-family: inherit; }
body .wrap { width: min(1280px, calc(100% - 64px)); }
body :is(h1,h2,h3) { font-family: "Onest", system-ui, sans-serif; line-height: 1.25; }
body main h1 { font-size: clamp(28px, 3.1vw, 43px); letter-spacing: -.8px; }
body main h2 { font-size: clamp(23px, 2.3vw, 28px); letter-spacing: -.4px; }
body :is(.site-header,.crm-header,.nb-header) {
  background: #fff; border-bottom: 1px solid var(--line); box-shadow: none;
}
body :is(.header-inner,.crm-header-inner) {
  min-height: 86px; display: flex; align-items: center; gap: 20px;
  padding-block: 12px; flex-wrap: wrap;
}
body :is(.site-header,.crm-header) .brand { flex: 0 0 auto; min-width: 0; width: auto; }
body :is(.site-header,.crm-header) .brand-logo { width: 190px; height: auto; max-height: 52px; object-fit: contain; filter: none; }
body :is(.site-header,.crm-header) .header-controls { margin-left: auto; gap: 14px; }
body :is(.header-action,.crm-catalog-link,.submission-back) {
  background: #fff; color: #a82b36; border: 1px solid #e8d6d8;
  border-radius: 10px; padding: 10px 16px; min-height: 44px;
  font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: none;
}
body .header-profile { background: transparent; border: 0; color: var(--ink); font-size: 14px; box-shadow: none; }
body .header-profile[hidden] { display:none !important; }
body .lt-account-menu { position:relative; display:inline-flex; align-items:center; }
body .lt-account-trigger { display:inline-flex; align-items:center; gap:8px; min-height:42px; padding:4px 8px 4px 5px; border:0; border-radius:999px; background:transparent; color:var(--ink); font:600 14px/1 inherit; cursor:pointer; }
body .lt-account-trigger:hover, body .lt-account-trigger[aria-expanded="true"] { background:#fff4f5; color:#a82b36; }
body .lt-account-avatar { display:grid; place-items:center; width:34px; height:34px; border-radius:50%; background:#f8eeee; color:#bb3e50; font-size:14px; font-weight:800; }
body .lt-account-chevron { font-size:18px; line-height:1; transform:translateY(-2px); }
body .lt-account-panel { position:absolute; z-index:90; top:calc(100% + 10px); right:0; display:grid; min-width:250px; padding:15px 0 10px; border:1px solid #eee2e3; border-radius:16px; background:#fff; box-shadow:0 18px 42px rgba(34,20,23,.16); }
body .lt-account-panel[hidden] { display:none; }
body .lt-account-panel p { margin:0; padding:0 18px 5px; color:#8f8f96; font-size:14px; font-weight:700; }
body .lt-account-panel strong { width:max-content; margin:0 18px 10px; padding:4px 8px; border-radius:999px; background:#fff0ef; color:#cf6048; font-size:11px; letter-spacing:.04em; }
body .lt-account-panel a, body .lt-account-panel button { display:block; width:100%; padding:10px 18px; border:0; background:transparent; color:#3d3b3b; font:500 16px/1.2 inherit; text-align:left; text-decoration:none; cursor:pointer; }
body .lt-account-panel a:hover, body .lt-account-panel button:hover { background:#fff6f6; color:#b52c44; }
body .lt-account-panel hr { width:100%; margin:7px 0 3px; border:0; border-top:1px solid #eee7e7; }
body .lt-account-panel [data-account-logout] { color:#d5494d; }
body .language-switcher { background: #fff; border: 0; box-shadow: none; padding: 0; gap: 0; }
body .language-switcher button { min-width: 32px; min-height: 36px; padding: 6px; font-size: 12px; }
body .language-switcher button.is-active { background: #fff3f5; color: #a82b36; }
body :is(.submission-form,.crm-panel,.profile-card,.agent-card,.nb-project,.modal-panel,.crm-dialog) {
  background: #fff; border-color: var(--line); border-radius: 14px; box-shadow: none;
}
body :is(.submission-form,.crm-field,.agent-directory-filters,.viewing-form) :is(input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea) {
  background: #fafafa; color: var(--ink); border: 1px solid var(--line);
  border-radius: 9px; padding: 12px; font-size: 15px; min-height: 44px;
}
body :is(.request-create-action,.submission-submit,.crm-primary-link) {
  background: var(--red); color: #fff; border: 1px solid var(--red);
  border-radius: 10px; min-height: 44px; box-shadow: none;
}
body :is(.request-create-action,.submission-submit,.crm-primary-link):hover { background: var(--red-hover); }
body .filters { background: transparent; border-color: var(--line); }
body .chip { border-radius: 9px; background: #fff; border-color: var(--line); font-size: 14px; }
body .chip.is-active { background: #fff; color: #c91f29; border-color: #e7c6ce; box-shadow: inset 0 -3px #e52732; }
body :is(.request-jump,.request-view-action) { border-radius: 10px; box-shadow: none; }
body :is(.requests-grid,.agent-directory-grid) { gap: 22px; }
body .request-card { background: #fff; border-color: var(--line); border-radius: 14px; box-shadow: none; }
body .request-card .card-body { padding: 16px; }
body .request-card .title { font-size: 18px; }
body .request-card .price { font-size: 24px; }
body :is(.card-action[href^="https://wa.me/"],.button.whatsapp) { color: #187544; background: #f2f8f4; border-color: #c8dfcf; }
body :is(a,button,input,select,textarea,summary):focus-visible { outline: 3px solid #b83246; outline-offset: 3px; }
body :is(button,input,select,textarea):disabled { cursor: not-allowed; opacity: .6; }
/* The project pages have their own layout, but share the brand treatment. */
body .nb-hero { background: linear-gradient(115deg,#4b1a27,#602534 62%,#541d2b); border-radius: 22px; }
body .nb-header { font-family: inherit; gap: 16px; flex-wrap: wrap; }
body .nb-header > a { font-size: 16px; }
body .nb-header > a:first-child { font-size: 28px; }
body .submission-page-nav { padding-block: 18px; border-bottom: 1px solid var(--line); }
@media (max-width: 900px) {
  body :is(.header-inner,.crm-header-inner) { gap: 10px; }
  body :is(.site-header,.crm-header) .brand-logo { width: 154px; }
  body :is(.site-header,.crm-header) .header-controls { gap: 8px; flex-wrap: wrap; }
}
@media (max-width: 600px) {

  body .language-switcher button { min-width: 29px; padding: 4px; font-size: 11px; }

@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body .lt-header { background: #fff; border-bottom: 1px solid var(--line); }
/* One predictable header row on every desktop page.  Older page-specific grids
   are intentionally overridden here so injected navigation cannot drop below. */
body .lt-header-row,
body .site-header.internal-header .header-inner.lt-header-row {
  display: flex; align-items: center; justify-content: flex-start;
  gap: 20px; flex-wrap: nowrap; min-height: 86px;
}
body .lt-header-row > .brand { order: 1; flex: 0 0 auto; }
body .lt-header-row .brand-logo { width: 190px; height: auto; max-height: 52px; }
body .lt-navigation { display: flex; order: 2; flex: 0 1 auto; gap: 18px; align-items: center; margin-right: auto; min-width: 0; }
body .lt-navigation a {
  color: #4d4b4b; font-family: "Onest", "Onest", system-ui, sans-serif;
  font-size: 13px; font-weight: 700; letter-spacing: -.15px; text-decoration: none;
  white-space: nowrap; transition: color .16s ease;
}
body .lt-navigation a:hover { color: #a82b36; }
body .lt-navigation a[aria-current] { color: #a82b36; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 8px; }
body .lt-header-row > .language-switcher { order: 3; margin-left: 0; flex: 0 0 auto; }

body .lt-header-row > .lt-account-menu { order: 4; margin-left: 0; flex: 0 0 auto; }
body .lt-header-row > .header-controls,
body .lt-header-row > .header-utility-controls { order: 5; margin-left: 0; flex: 0 0 auto; }
body .lt-header-row > :is(.submission-back,.crm-catalog-link) { order: 0; margin: 0; flex: 0 0 auto; }
body .lt-header-row > nav:has([data-lang]) { display: flex; gap: 0; }
body .lt-header-row [data-lang] { border: 0; background: #fff; color: #707070; min-height: 36px; padding: 6px; border-radius: 9px; font-size: 12px; }
body .lt-header-row [data-lang][aria-pressed=true] { background: #fff3f5; color: #a82b36; }

body .internal-back-row .submission-back { display:inline-flex; align-items:center; }
@media (max-width: 1120px) {
  body .lt-header-row { gap: 12px; }
  body .lt-navigation { gap: 12px; }
  body .lt-header-row .brand-logo { width: 154px; }

@media (max-width: 900px) {
  body .lt-navigation {
    order: 10; flex-basis: 100%; border-top: 1px solid var(--line); padding-block: 10px;
    overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: none;

}
@media (max-width: 600px) {
  body .lt-header-row { min-height: 70px; gap: 8px; }
  body .lt-header-row .brand-logo { width: 133px; max-height: 40px; }
  body .lt-navigation { justify-content: flex-start; gap: 18px; }

  body:not(.home-redesign) .lt-header-row > .header-controls { order: 2; flex: 1 1 100%; width: 100%; justify-content: flex-end; }
  body:not(.home-redesign) .lt-header-row > .lt-navigation { order: 3; }
  body .internal-back-row .wrap { min-height:52px; }
}

/* ── Palette ── */
:root {
  --v20-ink: #242321;
  --v20-accent: #7b233f;
  --v20-accent-hover: #601a31;
  --v20-accent-soft: #f3e6eb;
  --v20-accent-secondary: #df8739;
  --v20-paper: #F5F7FA;
  --v20-line: #e4dfd8;
  --v20-muted: #56524d;
  --v20-field-line: #91867c;
}
body.v20[data-public-theme="dark"] {
  --v20-ink: #eee9e2;
  --v20-accent: #e49ab0;
  --v20-accent-hover: #f0b5c6;
  --v20-paper: #1c1918;
  --v20-line: #554b47;
  --v20-muted: #c1b6ae;
  --v20-field-line: #95847a;
  --v20-accent-soft: #442735;
}

body.v20 {
  margin: 0;
  background: var(--v20-paper);
  color: var(--v20-ink);
  font: 16px/1.5 'Segoe UI', Arial, sans-serif;
}
body.v20[data-public-theme="dark"] {
  background: var(--v20-paper);
  color: var(--v20-ink);
}

/* ── Typography ── */
body.v20 :is(h1, h2, h3) {
  font-family: 'Segoe UI', Arial, sans-serif;
  color: var(--v20-ink);
}
body.v20 h1 { font-weight: 500; font-size: clamp(30px, 2.8vw, 40px); letter-spacing: -1px; line-height: 1.16; }
body.v20 h2 { font-weight: 650; font-size: 28px; }
body.v20 h3 { font-weight: 650; font-size: 18px; }
body.v20 a { color: var(--v20-accent); }

/* ── Header ── */
body.v20 .site-header,
body.v20 .crm-header,
body.v20 .nb-header,
body.v20 > header.site-header {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 18px;
  padding: 12px max(24px, calc((100vw - 1320px) / 2));
  align-items: center;
  background: var(--v20-paper);
  border-bottom: 1px solid var(--v20-line);
}
body.v20[data-public-theme="dark"] .site-header,
body.v20[data-public-theme="dark"] .crm-header,
body.v20[data-public-theme="dark"] > header.site-header {
  background: var(--v20-paper);
  border-color: var(--v20-line);
}

/* Logo — monochrome wordmark */
body.v20 .brand,
body.v20 .brand-wordmark,
body.v20 .logo {
  font: 850 25px/1.1 'Segoe UI', Arial, sans-serif;
  letter-spacing: -1px;
  color: var(--v20-accent) !important;
  text-decoration: none;
  white-space: nowrap;
}
body.v20 .brand-wordmark { color: var(--v20-accent) !important; }
body.v20 img.brand-logo,
body.v20 .brand > img,
body.v20 .brand .brand-subtitle,
body.v20 .lt-brand-monogram,
body.v20 .brand .lt-wordmark small { display: none !important; } /* hide old logo elements — v20-global.css only loads on v20 pages */
.brand .lt-wordmark {
  font: 850 25px/1.1 'Segoe UI', Arial, sans-serif !important;
  letter-spacing: -1px !important;
  color: var(--v20-accent) !important;
}
body.v20[data-public-theme="dark"] .brand .lt-wordmark { color: #f2cad7 !important; }
body.v20 .brand::after {
  content: '';
  display: inline-block;
  width: 7px; height: 7px;
  margin-left: 5px;
  border-radius: 50%;
  background: var(--v20-accent-secondary);
  vertical-align: middle;
}
body.v20[data-public-theme="dark"] .brand,
body.v20[data-public-theme="dark"] .brand-wordmark {
  color: #f2cad7 !important;
}

/* Navigation */
body.v20 .site-header nav,
body.v20 .header-inner nav,
body.v20 .home-navigation {
  display: flex;
  gap: 2px;
  justify-content: center;
  align-items: center;
  margin: 0;
}
body.v20 .site-header nav a,
body.v20 .home-navigation a,
body.v20 .header-inner nav a {
  padding: 9px 8px;
  font-size: 12px;
  line-height: 1.3;
  font-weight: 600;
  border-radius: 9px;
  text-decoration: none;
  color: var(--v20-ink);
  border: 0;
  background: transparent;
}
body.v20 .site-header nav a:hover,
body.v20 .home-navigation a:hover {
  background: var(--v20-accent-soft);
  color: var(--v20-accent-hover);
}
body.v20 .site-header nav a.active,
body.v20 nav button.active {
  background: var(--v20-accent-soft);
  color: var(--v20-accent-hover);
  font-weight: 700;
}
body.v20[data-public-theme="dark"] .site-header nav a,
body.v20[data-public-theme="dark"] .home-navigation a {
  color: var(--v20-ink);
}
body.v20[data-public-theme="dark"] nav a.active,
body.v20[data-public-theme="dark"] nav button.active {
  background: var(--v20-accent-soft);
  color: #f4bdd0;
}

/* Header controls — theme toggle, locale */
body.v20 .header-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}
body.v20 .header-action,
body.v20 .header-profile,
body.v20 .header-directory {
  font-size: 12px;
  font-weight: 600;
  padding: 9px 12px;
  border-radius: 9px;
  text-decoration: none;
  color: var(--v20-ink);
}
body.v20 .header-action {
  background: var(--v20-accent);
  color: #fff;
  border-radius: 9px;
  padding: 9px 14px;
}
body.v20 .header-action:hover {
  background: var(--v20-accent-hover);
}

/* v20 header-tools (theme toggle + locale) */
body.v20 .v20-header-tools {
  display: flex;
  align-items: center;
  gap: 10px;
}
body.v20 .v20-theme-toggle {
  border: 1px solid var(--v20-line);
  background: transparent;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--v20-ink);
  cursor: pointer;
}
body.v20 .v20-locale-select {
  border: 1px solid var(--v20-line);
  background: transparent;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--v20-ink);
}
body.v20[data-public-theme="dark"] .v20-theme-toggle,
body.v20[data-public-theme="dark"] .v20-locale-select {
  background: #282321;
  color: var(--v20-ink);
  border-color: var(--v20-field-line);
}

/* ── Footer ── */
body.v20 .site-footer {
  border-top: 1px solid var(--v20-line);
  padding: 22px 24px;
  color: var(--v20-muted);
  font-size: 13px;
  text-align: center;
  background: var(--v20-paper);
}
body.v20[data-public-theme="dark"] .site-footer {
  border-color: var(--v20-line);
  color: var(--v20-muted);
  background: var(--v20-paper);
}

/* ── Cards ── */
body.v20 .card {
  border: 1px solid var(--v20-line);
  border-radius: 20px;
  background: white;
  box-shadow: 0 4px 18px #32291c04;
}
body.v20[data-public-theme="dark"] .card {
  background: #282321;
  border-color: var(--v20-line);
  box-shadow: none;
}
body.v20[data-public-theme="dark"] .card :is(.title, .price) {
  color: var(--v20-ink);
}

/* ── Buttons ── */
body.v20 button {
  font: inherit;
  border: 1px solid var(--v20-line);
  padding: 11px 18px;
  background: white;
  border-radius: 8px;
  color: var(--v20-ink);
  cursor: pointer;
}
body.v20 button:hover { border-color: var(--v20-accent); }
body.v20 button.primary,
body.v20 .btn-primary {
  background: var(--v20-accent);
  color: #fff;
  border-color: var(--v20-accent);
}
body.v20 button.primary:hover { background: var(--v20-accent-hover); }
body.v20[data-public-theme="dark"] button {
  background: #282321;
  color: var(--v20-ink);
  border-color: var(--v20-field-line);
}
body.v20[data-public-theme="dark"] button.primary {
  background: var(--v20-accent);
  color: #24171c;
  border-color: var(--v20-accent);
}

/* ── Inputs ── */
body.v20 input, body.v20 select, body.v20 textarea {
  font: inherit;
  border: 1px solid var(--v20-line);
  border-radius: 8px;
  padding: 10px 12px;
  background: white;
  color: var(--v20-ink);
}
body.v20[data-public-theme="dark"] input,
body.v20[data-public-theme="dark"] select,
body.v20[data-public-theme="dark"] textarea {
  background: #282321;
  color: var(--v20-ink);
  border-color: var(--v20-field-line);
}

/* ── Panels / sections ── */
body.v20 .panel, body.v20 .search {
  background: white;
  border: 1px solid var(--v20-line);
  border-radius: 16px;
}
body.v20[data-public-theme="dark"] .panel,
body.v20[data-public-theme="dark"] .search {
  background: #282321;
  border-color: var(--v20-line);
  box-shadow: none;
}

/* ── Dialog ── */
body.v20[data-public-theme="dark"] dialog {
  background: #282321;
  color: var(--v20-ink);
  border-color: var(--v20-field-line);
}
body.v20[data-public-theme="dark"] dialog::backdrop { background: #000a; }

/* ── Eyebrow / pill / badge ── */
body.v20 .eyebrow, body.v20 .pill {
  background: var(--v20-accent-soft);
  color: var(--v20-accent-hover);
  font-size: 11px;
  letter-spacing: .08em;
  padding: 4px 10px;
  border-radius: 999px;
}
body.v20[data-public-theme="dark"] .eyebrow,
body.v20[data-public-theme="dark"] .pill {
  background: #442735;
  color: #f4c6d4;
}

/* ── Wrap utility ── */
body.v20 .wrap {
  width: calc(100% - 48px);
  max-width: 1200px;
  margin-inline: auto;
}

/* ── Responsive ── */
@media (max-width: 1100px) {
  body.v20 .site-header,
  body.v20 .crm-header,
  body.v20 > header.site-header {
    grid-template-columns: auto 1fr;
    gap: 10px 18px;
  }
  body.v20 .site-header nav,
  body.v20 .home-navigation {
    grid-column: 1 / -1;
    grid-row: 2;
    justify-content: flex-start;
  }
}
@media (max-width: 760px) {
  body.v20 .site-header,
  body.v20 .crm-header,
  body.v20 > header.site-header {
    padding: 12px 16px;
    gap: 12px 8px;
  }
  body.v20 .brand, body.v20 .logo { font-size: 23px; }
  body.v20 .site-header nav a,
  body.v20 .home-navigation a {
    font-size: 12px;
    padding: 9px 8px;
    min-height: 36px;
  }
  body.v20 .wrap { width: calc(100% - 32px); }
  body.v20 h1 { font-size: 32px; }
}

/* ── Submission / internal pages ── */
body.v20.submission-page main { max-width: 720px; margin: 0 auto; padding: 32px 24px; }
body.v20.submission-page .submission-back { color: var(--v20-muted); text-decoration: none; font-size: 14px; }
body.v20 .internal-back-row { background: var(--v20-paper); padding: 12px 0; }
body.v20 .internal-back-row .wrap { max-width: 1200px; }

/* ── Mortgage page ── */
body.v20 .mortgage-main { max-width: 800px; margin: 0 auto; padding: 32px 24px; }
body.v20 .mortgage-main h1 { margin-bottom: 16px; }
body.v20 .mortgage-main .calc-group { margin: 16px 0; }
body.v20 .mortgage-main label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--v20-ink); }
body.v20 .mortgage-main input,
body.v20 .mortgage-main select { width: 100%; }
body.v20 .mortgage-main .calc-result { background: var(--v20-accent-soft); border-radius: 12px; padding: 16px; margin: 20px 0; }

/* ── Agent directory ── */
body.v20.agent-directory-page .agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
body.v20 .agent-card { border: 1px solid var(--v20-line); border-radius: 16px; padding: 20px; background: white; }
body.v20[data-public-theme="dark"] .agent-card { background: #282321; border-color: var(--v20-line); }

/* ── Requests page ── */
body.v20 .request-card { border: 1px solid var(--v20-line); border-radius: 16px; padding: 18px; background: white; }
body.v20[data-public-theme="dark"] .request-card { background: #282321; border-color: var(--v20-line); }

/* ── Object detail ── */
body.v20.object-detail-page .object-gallery { border-radius: 16px; overflow: hidden; }
body.v20.object-detail-page .object-info { padding: 24px; }
body.v20.object-detail-page .object-sidebar { border: 1px solid var(--v20-line); border-radius: 16px; padding: 20px; }
body.v20[data-public-theme="dark"].object-detail-page .object-sidebar { background: #282321; border-color: var(--v20-line); }

/* ── Profile page ── */
body.v20.profile-page main { max-width: 800px; margin: 0 auto; padding: 32px 24px; }

/* ── Newbuildings ── */
body.v20 .nb-main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
body.v20 .nb-hero { text-align: center; padding: 32px 0; }
body.v20 .nb-hero h1 { font-weight: 650; }
body.v20 .nb-project { border: 1px solid var(--v20-line); border-radius: 16px; overflow: hidden; margin-bottom: 24px; }
body.v20[data-public-theme="dark"] .nb-project { background: #282321; border-color: var(--v20-line); }

/* ── Mortgage: override red buttons to burgundy ── */
body.v20 .mortgage-cta,
body.v20 .mortgage-btn,
body.v20 [class*="mortgage"] .btn,
body.v20 [class*="mortgage"] a[class*="btn"],
body.v20 [class*="mortgage"] button[type="submit"] {
  background: var(--v20-accent) !important;
  border-color: var(--v20-accent) !important;
  color: #fff !important;
  border-radius: 10px;
}

/* ── Language selector overrides (agents, requests pages) ── */
body.v20 .locale-buttons a,
body.v20 .lang-switch a,
body.v20 .language-selector a {
  font-size: 12px !important;
  padding: 4px 8px !important;
  min-width: 0 !important;
  min-height: 0 !important;
  border-radius: 6px;
}

/* ── Newbuildings header fix ── */
body.v20 .nb-header .header-inner,
body.v20 .nb-header {
  display: grid !important;
  grid-template-columns: auto minmax(0, 1fr) auto !important;
  gap: 18px;
  padding: 12px max(24px, calc((100vw - 1320px) / 2));
  align-items: center;
  background: var(--v20-paper);
  border-bottom: 1px solid var(--v20-line);
}
body.v20 .nb-header .nb-phone-row { display: none; }

/* Some legacy form controls use an explicit white background with high specificity. */
body.v20[data-public-theme="dark"] :is(input, select, textarea) {
  background: #282321 !important;
  color: #eee9e2 !important;
  border-color: #95847a !important;
}
body.v20[data-public-theme="dark"] :is(input, textarea)::placeholder {
  color: #c1b6ae !important;
  opacity: 1;
}

/* Keep the sign-in heading legible over its dark photo background. */
body.v20 .registration-entry-card h2{color:#fff!important}

</style><style id="legal-navy-20261030">.legal-support,.legal-agent-strip{--legal-ink:#f7fbff;--legal-text:#dae7f1;--legal-muted:#bfd2e0;--legal-eyebrow:#a9d7f4;--legal-accent:#287cad;--legal-accent-hover:#1d6795;--legal-border:#7298b3;--legal-bg-start:#183d5d;--legal-bg-end:#0e2944}
