<!doctype html>
<html lang="ru"><head>
  <script src="/telegram-membership.js?v=20260915-1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Заявка на поиск — Liberterra</title><link rel="stylesheet" href="/style.css?v=20261005-login-eye-1"><script src="/catalog-translations.js?v=20260820-1" defer></script><script src="/i18n.js?v=20261009-public-request-contacts-1" defer></script><link rel="stylesheet" href="/site-theme.css?v=20260930-nav-3">
<script src="/site-theme.js?v=20260930-nav-3" defer></script>
<link rel="stylesheet" href="/public-v20.css"><script src="/reference-translations.js" defer></script><script src="/public-copy.js" defer></script><script src="/reference-translator.js" defer></script><script src="/public-v20.js" defer></script>  <link rel="stylesheet" href="/v20-global.css?v=20261022-1">
</head>
<body class="v20 submission-page">
<nav class="submission-page-nav wrap" aria-label="Навигация формы"><a href="/requests.html" data-smart-back>← Назад</a><a href="/miniapp.html" target="_top">На главную</a></nav>
<main class="submission-main wrap">
  <section class="submission-intro"><span class="submission-eyebrow">Бесплатная заявка</span><h1>Что вы ищете?</h1><p>Заполните пожелания — команда Liberterra получит заявку и свяжется с вами.</p></section>
  <form class="submission-form" id="searchRequestForm" novalidate>
    <label class="submission-honeypot" aria-hidden="true">Ваш сайт<input name="website" tabindex="-1" autocomplete="off"></label>
    <fieldset><legend>Параметры поиска</legend><div class="submission-grid two">
      <label><span>Что хотите сделать? *</span><select name="deal" required><option value="Аренда">Снять</option><option value="Покупка">Купить</option></select></label>
      <label><span>Тип недвижимости *</span><select name="housing_type" required><option value="">Выберите</option><option>Квартира</option><option>Дом</option><option>Комната</option><option>Коммерческая недвижимость</option><option>Земельный участок</option></select></label>
      <label><span>Район или ориентир *</span><input name="district" required maxlength="160" list="submissionDistricts" placeholder="Начните вводить название"></label>
      <label><span>Количество комнат</span><input name="rooms" inputmode="numeric" maxlength="20" placeholder="2"></label>
    </div><datalist id="submissionDistricts"></datalist>
    <div class="submission-price-row"><label><span>Бюджет до *</span><input name="budget" required inputmode="numeric" maxlength="50" placeholder="50000"></label><label><span>Валюта *</span><select name="budget_currency" required><option value="сом">сом</option><option value="$">$</option></select></label></div>
    <label><span>Дополнительные пожелания</span><textarea name="wishes" maxlength="1200" rows="5" placeholder="Срок, состояние, мебель и другие детали"></textarea></label></fieldset>
    <fieldset><legend>Ваши контакты</legend><div class="submission-grid two"><label><span>Имя *</span><input name="name" required maxlength="120" autocomplete="name" placeholder="Как к вам обращаться"></label><label><span>Телефон *</span><input name="phone" required maxlength="40" autocomplete="tel" inputmode="tel" placeholder="+996 555 000 000"></label></div>
      <label class="consent-row"><input type="checkbox" name="public_consent" value="yes" required><span>Я согласен опубликовать заявку и телефон в открытом каталоге Liberterra. Номер будет виден всем посетителям сайта.</span></label>
    </fieldset>
    <div class="submission-result" id="requestResult" role="alert" hidden></div><button class="submission-submit" type="submit">Отправить заявку</button>
  </form>
  <script src="/listing-format.js?v=20261006-audit-1" defer></script>
</main><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/user-registration.js?v=20261011-register-retry-1"></script><script src="/back-navigation.js?v=20260814-1"></script><script src="/script.js?v=20261006-audit-1" defer></script><script src="/add-request.js?v=20261021-guest-rate-limit-1" defer></script>  <script src="/v20-global.js?v=20261022-1" defer></script>
</body></html>
